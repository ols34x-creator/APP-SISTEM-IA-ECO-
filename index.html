<style>
:root {
    /* Default Theme (Original) */
    --color-primary-val: 20 184 166;
    --color-secondary-val: 59 130 246;
    --color-success-val: 34 197 94;
    --color-warning-val: 245 158 11;
    --color-danger-val: 239 68 68;
    --color-light-val: 248 250 252;
    --color-bg-main-val: 15 23 42;
    --color-bg-card-val: 30 41 59;
    --color-gray-text-val: 148 163 184;
    --color-border-color-val: 51 65 85;
}

/* Global Styles */
body {
    background-color: rgb(var(--color-bg-main-val));
    color: rgb(var(--color-gray-text-val));
    font-family: 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* Background Particles */
#particles-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
    z-index: -1;
}
.particle {
    position: absolute;
    bottom: -10px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    opacity: 0;
    animation: rise 15s infinite linear;
}
@keyframes rise {
    0% { transform: translateY(0); opacity: 0.7; }
    100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
}

</style>
